server.port=8080

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=admin
spring.cloud.gateway.routes[0].uri=lb://ewm-main-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**

spring.cloud.gateway.routes[1].id=users
spring.cloud.gateway.routes[1].uri=lb://ewm-main-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=events
spring.cloud.gateway.routes[2].uri=lb://ewm-main-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/events/**

spring.cloud.gateway.routes[3].id=categories
spring.cloud.gateway.routes[3].uri=lb://ewm-main-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/categories/**

spring.cloud.gateway.routes[4].id=compilations
spring.cloud.gateway.routes[4].uri=lb://ewm-main-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/compilations/**

spring.cloud.gateway.routes[5].id=user-ratings
spring.cloud.gateway.routes[5].uri=lb://ewm-main-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/user/**

management.endpoints.web.exposure.include=health,gateway
